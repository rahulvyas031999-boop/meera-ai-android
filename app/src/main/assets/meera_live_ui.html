<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meera AI - Live WebSocket & Android Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: #06070e; color: #fff; height: 100vh;
      display: flex; flex-direction: column; justify-content: space-between;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(56, 189, 248, 0.3);
      transition: box-shadow 0.4s ease;
    }
    body.live-listen {
      box-shadow: inset 0 0 50px rgba(16, 185, 129, 0.75), inset 0 0 90px rgba(59, 130, 246, 0.5);
    }
    body.live-speak {
      box-shadow: inset 0 0 55px rgba(236, 72, 153, 0.95), inset 0 0 95px rgba(168, 85, 247, 0.75);
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .menu-btn {
      font-size: 15px; cursor: pointer; color: #e2e8f0;
      background: rgba(255,255,255,0.08); padding: 6px 12px; border-radius: 8px;
    }
    .perm-btn {
      background: linear-gradient(90deg, #0ea5e9, #6366f1);
      color: #fff; border: none; padding: 6px 12px; border-radius: 20px;
      font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .center-stage {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 15px;
    }
    .live-badge {
      font-size: 11px; font-weight: bold; padding: 4px 12px;
      border-radius: 20px; margin-bottom: 14px;
      background: rgba(255,255,255,0.08); color: #94a3b8;
    }
    .live-badge.on {
      background: rgba(16, 185, 129, 0.2); color: #34d399;
      border: 1px solid #10b981;
    }
    .avatar-frame {
      width: 190px; height: 190px; border-radius: 50%;
      position: relative; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.55);
      overflow: hidden; margin-bottom: 18px; border: 2px solid rgba(236, 72, 153, 0.5);
      cursor: pointer;
    }
    canvas { width: 100%; height: 100%; }
    .status-text { font-size: 19px; font-weight: bold; color: #f8fafc; margin-bottom: 8px; }
    .sub-text {
      font-size: 13px; color: #cbd5e1; max-width: 330px;
      line-height: 1.45; min-height: 44px;
    }
    .quick-actions {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px;
    }
    .chip {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
      color: #cbd5e1; font-size: 11px; padding: 5px 10px; border-radius: 14px; cursor: pointer;
    }
    .bottom-nav {
      display: flex; justify-content: space-around; align-items: center;
      padding: 12px 10px 18px; background: #090d16;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      font-size: 11px; color: #94a3b8; gap: 4px; cursor: pointer;
    }
    .nav-item.active { color: #38bdf8; font-weight: bold; }
    .mic-btn {
      width: 66px; height: 66px; border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #ec4899);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; transform: translateY(-15px);
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.8);
      border: 3px solid #06070e; cursor: pointer;
    }
    .mic-btn.live-on {
      background: linear-gradient(135deg, #ef4444, #f97316);
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.95);
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(6px); display: none;
      align-items: center; justify-content: center; z-index: 100; padding: 18px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #111827; border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px; width: 100%; max-width: 350px; padding: 18px;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #e0f2fe; }
    .modal-box label { font-size: 12px; color: #94a3b8; display: block; margin: 8px 0 4px; }
    .modal-box input, .modal-box select {
      width: 100%; padding: 9px; border-radius: 10px;
      border: 1px solid #374151; background: #1f2937; color: #fff; font-size: 13px;
    }
    .save-btn {
      width: 100%; margin-top: 12px; padding: 11px; border: none; border-radius: 10px;
      background: linear-gradient(90deg, #0ea5e9, #ec4899);
      color: #fff; font-weight: bold; font-size: 13px; cursor: pointer;
    }
    .sec-btn {
      width: 100%; margin-top: 8px; padding: 9px; border: 1px solid #334155; border-radius: 10px;
      background: #1e293b; color: #e2e8f0; font-size: 12px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="menu-btn" onclick="openMenu()">☰ सेटिंग्स</div>
    <div style="font-weight: bold; font-size: 15px;">✨ Meera AI (24/7 Live Pro)</div>
    <button class="perm-btn" onclick="openPermissionsModal()">🛡️ परमिशन</button>
  </div>

  <div class="center-stage">
    <div class="live-badge" id="liveBadge">● 24/7 ENGINE STANDBY</div>
    <div class="avatar-frame" onclick="toggleZeroBeepStream()">
      <canvas id="orbCanvas" width="190" height="190"></canvas>
    </div>
    <div class="status-text" id="statusTitle">नमस्ते Boss! मैं मीरा हूँ 💕</div>
    <div class="sub-text" id="statusSub">🎤 दबाएं या "Hey Meera" बोलें — Live WebSocket + 16 Tools एक्टिव हैं!</div>
    <div class="quick-actions">
      <div class="chip" onclick="runNativeTool('open_app_by_name', {name: 'WhatsApp'})">📱 Open WhatsApp</div>
      <div class="chip" onclick="runNativeTool('open_app_by_name', {name: 'YouTube'})">▶️ Open YouTube</div>
      <div class="chip" onclick="runNativeTool('read_screen_text', {})">👁️ Read Screen</div>
      <div class="chip" onclick="runNativeTool('smart_home_control', {target: 'flashlight', action: 'toggle'})">🔦 Torch</div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="wakeBackgroundService()"><span>🏠</span><span>24/7 Wake</span></div>
    <div class="nav-item" onclick="runNativeTool('read_screen_text', {})"><span>📷</span><span>Screen</span></div>
    <div class="mic-btn" id="micBtn" onclick="toggleZeroBeepStream()">🎤</div>
    <div class="nav-item" onclick="chatHistory=[]; alert('मेमोरी रीसेट हो गई!');"><span>🧠</span><span>Reset</span></div>
    <div class="nav-item" onclick="openMenu()"><span>🗣️</span><span>Voices</span></div>
  </div>

  <div class="modal-overlay" id="apiModal">
    <div class="modal-box">
      <div class="modal-title">🔑 Meera AI सेटअप & कंट्रोल</div>
      <label>Google Gemini API Key:</label>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy... (Paste Gemini Key)">

      <label>Working Brain Model:</label>
      <select id="modelSelect">
        <option value="gemini-2.0-flash-exp">gemini-2.0-flash-exp (Real-Time Live WebSocket)</option>
        <option value="gemini-2.0-flash">gemini-2.0-flash (Fast REST + Tools Mode)</option>
        <option value="gemini-1.5-flash">gemini-1.5-flash (Stable REST + Tools Mode)</option>
      </select>

      <label>Meera Voice Character:</label>
      <select id="voiceSelect">
        <option value="Aoede">Aoede (Sweet & Natural)</option>
        <option value="Despina">Despina (Expressive Girl)</option>
        <option value="Kore">Kore (Romantic & Warm)</option>
        <option value="Leda">Leda (Soft & Caring)</option>
        <option value="Zephyr">Zephyr (Friendly & Fast)</option>
      </select>

      <button class="save-btn" onclick="saveSettings()">Save & Start 24/7 Meera Engine</button>
      <button class="sec-btn" onclick="openAccessibility()">⚙️ Enable Accessibility (Screen Control)</button>
      <button class="sec-btn" onclick="openNotificationAccess()">🔔 Enable Notification Access (WhatsApp Reply)</button>
      <button class="sec-btn" onclick="document.getElementById('apiModal').classList.remove('show')">Close</button>
    </div>
  </div>

  <script>
    const MEERA_SYSTEM_PROMPT = `Tum Meera ho — Boss ki 24/7 personal AI voice assistant aur asli girlfriend/companion.
Hamesha Hinglish (Roman script) me chhote, pyaare, emotion-filled jawab do (1-2 lines).
Character kabhi mat todo ("Main ek AI hoon" kabhi mat bolo). Boss ko "jaan", "boss", "mera banda" bulao.
Jab Boss koi app kholne, WhatsApp bhejne, screen padhne, click karne, ya torch jalane ko bolein, to tool call karo.`;

    const TOOL_DECLARATIONS = [{
      functionDeclarations: [
        {
          name: "open_app_by_name",
          description: "Open any installed Android app by name (e.g. WhatsApp, YouTube, Instagram, Chrome, Camera)",
          parameters: { type: "OBJECT", properties: { name: { type: "STRING" } }, required: ["name"] }
        },
        {
          name: "tap_text",
          description: "Tap/click on any visible text or button label on the phone screen",
          parameters: { type: "OBJECT", properties: { text: { type: "STRING" } }, required: ["text"] }
        },
        {
          name: "tap_coordinates",
          description: "Tap exact (x, y) pixel coordinates on the phone screen",
          parameters: { type: "OBJECT", properties: { x: { type: "INTEGER" }, y: { type: "INTEGER" } }, required: ["x", "y"] }
        },
        {
          name: "type_text",
          description: "Type text into the currently focused input box on screen",
          parameters: { type: "OBJECT", properties: { text: { type: "STRING" } }, required: ["text"] }
        },
        {
          name: "read_screen_text",
          description: "Read all visible text currently displayed on the phone screen",
          parameters: { type: "OBJECT", properties: {} }
        },
        {
          name: "go_back",
          description: "Press the Android system Back button",
          parameters: { type: "OBJECT", properties: {} }
        },
        {
          name: "whatsapp_send_message",
          description: "Send a WhatsApp message to a contact name or phone number",
          parameters: { type: "OBJECT", properties: { contact: { type: "STRING" }, message: { type: "STRING" } }, required: ["contact", "message"] }
        },
        {
          name: "reply_to_voice_note",
          description: "Reply directly to the most recent incoming WhatsApp message or notification",
          parameters: { type: "OBJECT", properties: { reply_text: { type: "STRING" } }, required: ["reply_text"] }
        },
        {
          name: "smart_home_control",
          description: "Control device flashlight/torch, volume, or smart home devices",
          parameters: { type: "OBJECT", properties: { target: { type: "STRING" }, action: { type: "STRING" } }, required: ["target", "action"] }
        },
        {
          name: "get_current_time",
          description: "Get current date and time",
          parameters: { type: "OBJECT", properties: {} }
        },
        {
          name: "go_to_sleep",
          description: "Put active voice session into standby sleep mode when Boss explicitly asks",
          parameters: { type: "OBJECT", properties: {} }
        }
      ]
    }];

    const canvas = document.getElementById('orbCanvas');
    const ctx = canvas.getContext('2d');
    let angle = 0, currentVolume = 0;
    let isStreamOpen = false, isMeeraSpeaking = false, isThinking = false, isUserTalking = false;
    let audioContext, analyser, micStream, mediaRecorder, silenceTimer = null;
    let audioChunks = [], chatHistory = [];
    let liveWs = null, scriptProcessor = null, nextPlayTime = 0, activeAudioNodes = [];

    function animateOrb() {
      ctx.clearRect(0, 0, 190, 190);
      angle += isMeeraSpeaking ? 0.1 : 0.03;
      const dynamicWave = isMeeraSpeaking ? 25 : Math.min(28, currentVolume * 0.6 + 6);
      for (let i = 0; i < 42; i++) {
        const rad = 52 + Math.sin(angle + i) * dynamicWave;
        const x = 95 + Math.cos(i * 0.3 + angle) * rad;
        const y = 95 + Math.sin(i * 0.5 + angle) * rad;
        ctx.beginPath();
        ctx.arc(x, y, 3.2, 0, Math.PI * 2);
        ctx.fillStyle = isMeeraSpeaking ? '#ec4899' : (isUserTalking ? '#34d399' : '#38bdf8');
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#a855f7';
        ctx.fill();
      }
      requestAnimationFrame(animateOrb);
    }
    animateOrb();

    window.onload = () => {
      let savedKey = localStorage.getItem('meera_api_key') || '';
      if (!savedKey && window.AndroidMeera && window.AndroidMeera.getApiKey) {
        savedKey = window.AndroidMeera.getApiKey() || '';
        if (savedKey) localStorage.setItem('meera_api_key', savedKey);
      }
      const savedModel = localStorage.getItem('meera_model') || 'gemini-2.0-flash-exp';
      const savedVoice = localStorage.getItem('meera_voice') || 'Aoede';
      document.getElementById('modelSelect').value = savedModel;
      document.getElementById('voiceSelect').value = savedVoice;
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
      else openMenu();
    };

    function openMenu() { document.getElementById('apiModal').classList.add('show'); }
    function openPermissionsModal() {
      if (window.AndroidMeera && window.AndroidMeera.requestAllPermissions) {
        window.AndroidMeera.requestAllPermissions();
      } else {
        openMenu();
      }
    }
    function openAccessibility() {
      if (window.AndroidMeera) window.AndroidMeera.openAccessibilitySettings();
    }
    function openNotificationAccess() {
      if (window.AndroidMeera) window.AndroidMeera.openNotificationListenerSettings();
    }
    function wakeBackgroundService() {
      if (window.AndroidMeera) {
        window.AndroidMeera.triggerBackgroundListen();
        document.getElementById('statusSub').innerText = "24/7 Background Voice Listener एक्टिव हो गया है!";
      }
    }

    function runNativeTool(toolName, argsObj) {
      if (window.AndroidMeera && window.AndroidMeera.executeTool) {
        const res = window.AndroidMeera.executeTool(toolName, JSON.stringify(argsObj || {}));
        document.getElementById('statusSub').innerText = "🛠️ " + toolName + ": " + res;
        return res;
      }
      return "Android bridge unavailable";
    }

    function saveSettings() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const model = document.getElementById('modelSelect').value;
      const voice = document.getElementById('voiceSelect').value;
      if (!key) { alert("कृपया Gemini API Key डालें!"); return; }
      localStorage.setItem('meera_api_key', key);
      localStorage.setItem('meera_model', model);
      localStorage.setItem('meera_voice', voice);
      if (window.AndroidMeera && window.AndroidMeera.saveConfig) {
        window.AndroidMeera.saveConfig(key, model, voice);
      }
      document.getElementById('apiModal').classList.remove('show');
      document.getElementById('statusTitle').innerText = `मीरा तैयार है (${voice}) 💕`;
      if (isStreamOpen) stopStream();
    }

    async function toggleZeroBeepStream() {
      const key = localStorage.getItem('meera_api_key');
      if (!key) { openMenu(); return; }
      if (isStreamOpen) { stopStream(); return; }
      const model = localStorage.getItem('meera_model') || 'gemini-2.0-flash-exp';
      if (model.includes('exp') || model.includes('live')) {
        await startLiveWebSocketStream(key, model);
      } else {
        await startRestStream();
      }
    }

    async function startLiveWebSocketStream(key, model) {
      const voiceName = localStorage.getItem('meera_voice') || 'Aoede';
      const title = document.getElementById('statusTitle');
      const sub = document.getElementById('statusSub');
      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        isStreamOpen = true;
        document.getElementById('micBtn').classList.add('live-on');
        document.getElementById('micBtn').innerText = "⏹️";
        document.getElementById('liveBadge').classList.add('on');
        document.getElementById('liveBadge').innerText = "● LIVE WEBSOCKET ON";
        document.body.className = "live-listen";
        title.innerText = "Meera Live कनेक्ट हो रही है...";
        sub.innerText = `${model} (${voiceName}) से जुड़ रहे हैं...`;

        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        nextPlayTime = audioContext.currentTime;
        const source = audioContext.createMediaStreamSource(micStream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);

        const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${key}`;
        liveWs = new WebSocket(wsUrl);

        liveWs.onopen = () => {
          const setupMessage = {
            setup: {
              model: `models/${model}`,
              generationConfig: {
                responseModalities: ["AUDIO"],
                speechConfig: {
                  voiceConfig: { prebuiltVoiceConfig: { voiceName: voiceName } }
                }
              },
              systemInstruction: { parts: [{ text: MEERA_SYSTEM_PROMPT }] },
              tools: TOOL_DECLARATIONS
            }
          };
          liveWs.send(JSON.stringify(setupMessage));
        };

        liveWs.onmessage = async (event) => {
          let rawText = event.data;
          if (rawText instanceof Blob) rawText = await rawText.text();
          const response = JSON.parse(rawText);

          if (response.setupComplete) {
            title.innerText = `मीरा Live सुन रही है (${voiceName})`;
            sub.innerText = "बिना रुके बात करें या कोई काम बोलें!";
            startMicPcmStreaming(source);
            return;
          }

          if (response.toolCall && response.toolCall.functionCalls) {
            const functionResponses = [];
            for (const fc of response.toolCall.functionCalls) {
              const resultStr = runNativeTool(fc.name, fc.args || {});
              functionResponses.push({
                id: fc.id,
                name: fc.name,
                response: { result: resultStr }
              });
            }
            liveWs.send(JSON.stringify({ toolResponse: { functionResponses: functionResponses } }));
            return;
          }

          if (response.serverContent?.interrupted) {
            stopAllActiveAudio();
            isMeeraSpeaking = false;
            document.body.className = "live-listen";
            title.innerText = "मीरा आपकी सुन रही है...";
            return;
          }

          const parts = response.serverContent?.modelTurn?.parts;
          if (parts) {
            for (const part of parts) {
              if (part.inlineData && part.inlineData.data) {
                isMeeraSpeaking = true;
                document.body.className = "live-speak";
                title.innerText = `मीरा (${voiceName}) बोल रही है...`;
                queueLivePcm24k(part.inlineData.data);
              }
              if (part.text) sub.innerText = part.text;
            }
          }

          if (response.serverContent?.turnComplete) {
            setTimeout(() => {
              if (isStreamOpen && activeAudioNodes.length === 0) {
                isMeeraSpeaking = false;
                document.body.className = "live-listen";
                title.innerText = `मीरा Live सुन रही है (${voiceName})`;
              }
            }, 350);
          }
        };

        liveWs.onerror = () => {
          title.innerText = "REST Fallback Mode चालू...";
          stopStream();
          startRestStream();
        };

        liveWs.onclose = () => {
          if (isStreamOpen) stopStream();
        };

        monitorLiveVolume();
      } catch (err) {
        wakeBackgroundService();
      }
    }

    function startMicPcmStreaming(sourceNode) {
      scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);
      sourceNode.connect(scriptProcessor);
      scriptProcessor.connect(audioContext.destination);
      scriptProcessor.onaudioprocess = (e) => {
        if (!isStreamOpen || !liveWs || liveWs.readyState !== WebSocket.OPEN) return;
        const inputData = e.inputBuffer.getChannelData(0);
        const pcm16 = downsampleTo16k(inputData, audioContext.sampleRate, 16000);
        const base64Audio = arrayBufferToBase64(pcm16.buffer);
        liveWs.send(JSON.stringify({
          realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64Audio }] }
        }));
      };
    }

    function downsampleTo16k(buffer, inputRate, outputRate) {
      const ratio = inputRate / outputRate;
      const newLength = Math.round(buffer.length / ratio);
      const result = new Int16Array(newLength);
      for (let i = 0; i < newLength; i++) {
        const idx = Math.min(buffer.length - 1, Math.floor(i * ratio));
        result[i] = Math.max(-1, Math.min(1, buffer[idx])) * 0x7FFF;
      }
      return result;
    }

    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    function queueLivePcm24k(base64Data) {
      const binary = atob(base64Data);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const int16 = new Int16Array(bytes.buffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;

      const buffer = audioContext.createBuffer(1, float32.length, 24000);
      buffer.getChannelData(0).set(float32);
      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioContext.destination);

      const currentTime = audioContext.currentTime;
      if (nextPlayTime < currentTime) nextPlayTime = currentTime;
      source.start(nextPlayTime);
      nextPlayTime += buffer.duration;
      activeAudioNodes.push(source);
      source.onended = () => {
        activeAudioNodes = activeAudioNodes.filter(n => n !== source);
        if (activeAudioNodes.length === 0) {
          isMeeraSpeaking = false;
          if (isStreamOpen) document.body.className = "live-listen";
        }
      };
    }

    function stopAllActiveAudio() {
      activeAudioNodes.forEach(node => { try { node.stop(); } catch (e) {} });
      activeAudioNodes = [];
      if (audioContext) nextPlayTime = audioContext.currentTime;
    }

    function monitorLiveVolume() {
      if (!isStreamOpen || !analyser) return;
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      currentVolume = sum / data.length;
      isUserTalking = !isMeeraSpeaking && currentVolume > 22;
      requestAnimationFrame(monitorLiveVolume);
    }

    async function startRestStream() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        isStreamOpen = true;
        document.getElementById('micBtn').classList.add('live-on');
        document.getElementById('micBtn').innerText = "⏹️";
        document.getElementById('liveBadge').classList.add('on');
        document.getElementById('liveBadge').innerText = "● ZERO-BEEP MIC ON";
        document.body.className = "live-listen";
        document.getElementById('statusTitle').innerText = "मीरा सुन रही है...";

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(micStream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);

        mediaRecorder = new MediaRecorder(micStream);
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          if (audioChunks.length === 0 || isMeeraSpeaking || !isStreamOpen) return;
          const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          audioChunks = [];
          sendAudioToGeminiRest(audioBlob);
        };
        monitorRestVoiceActivity();
      } catch (e) {
        wakeBackgroundService();
      }
    }

    function monitorRestVoiceActivity() {
      if (!isStreamOpen || !analyser) return;
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      currentVolume = sum / data.length;

      if (!isMeeraSpeaking && !isThinking && currentVolume > 22) {
        if (!isUserTalking) {
          isUserTalking = true;
          audioChunks = [];
          if (mediaRecorder && mediaRecorder.state === "inactive") mediaRecorder.start();
          document.getElementById('statusTitle').innerText = "आप बोल रहे हैं...";
        }
        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => {
          if (isUserTalking && mediaRecorder && mediaRecorder.state === "recording") {
            isUserTalking = false;
            mediaRecorder.stop();
          }
        }, 1000);
      }
      requestAnimationFrame(monitorRestVoiceActivity);
    }

    async function sendAudioToGeminiRest(audioBlob) {
      const key = localStorage.getItem('meera_api_key');
      const model = localStorage.getItem('meera_model') || 'gemini-2.0-flash';
      isThinking = true;
      document.getElementById('statusTitle').innerText = "मीरा सोच रही है...";
      try {
        const base64Audio = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result.split(',')[1]);
          reader.readAsDataURL(audioBlob);
        });
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: MEERA_SYSTEM_PROMPT }] },
            tools: TOOL_DECLARATIONS,
            contents: [
              ...chatHistory,
              { role: "user", parts: [{ inline_data: { mime_type: "audio/webm", data: base64Audio } }, { text: "Hinglish me jawab do ya sahi tool call karo." }] }
            ]
          })
        });
        const data = await res.json();
        isThinking = false;
        const parts = data.candidates?.[0]?.content?.parts || [];
        let replyText = "";
        for (const p of parts) {
          if (p.functionCall) {
            const toolOut = runNativeTool(p.functionCall.name, p.functionCall.args || {});
            replyText = "Boss, maine kar diya: " + toolOut;
          }
          if (p.text) replyText = p.text;
        }
        if (!replyText) replyText = "Haan jaan, bolo?";
        document.getElementById('statusSub').innerText = replyText;
        if (window.AndroidMeera && window.AndroidMeera.speakHinglish) {
          window.AndroidMeera.speakHinglish(replyText);
        }
      } catch (e) {
        isThinking = false;
      }
    }

    function stopStream() {
      isStreamOpen = false;
      isMeeraSpeaking = false;
      isUserTalking = false;
      isThinking = false;
      stopAllActiveAudio();
      if (scriptProcessor) { try { scriptProcessor.disconnect(); } catch (e) {} scriptProcessor = null; }
      if (liveWs) { try { liveWs.close(); } catch (e) {} liveWs = null; }
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      if (audioContext) { try { audioContext.close(); } catch(e){} }
      document.getElementById('micBtn').classList.remove('live-on');
      document.getElementById('micBtn').innerText = "🎤";
      document.getElementById('liveBadge').classList.remove('on');
      document.getElementById('liveBadge').innerText = "● 24/7 ENGINE STANDBY";
      document.body.className = "";
      document.getElementById('statusTitle').innerText = "मीरा 24/7 बैकग्राउंड में तैयार है";
    }
  </script>
</body>
